name: Contact form configuration
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect configuration or enable the approved contact form
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - install
          - enable
          - disable
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect contact configuration without revealing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          CONTACT_CONFIG_MODE: ${{ inputs.mode }}
          CONTACT_SETUP_RELAY_URL: ${{ secrets.CONTACT_SETUP_RELAY_URL }}
          CONTACT_SETUP_RELAY_SECRET: ${{ secrets.CONTACT_SETUP_RELAY_SECRET }}
        run: python3 scripts/contact-form-config.py
