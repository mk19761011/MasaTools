<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" role="img" aria-label="Google Playのテスター参加画面の画像を差し替える枠">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="870" fill="url(#bg2)"/>

  <!-- テスター参加ページのイメージ -->
  <g transform="translate(460 175)">
    <rect x="0" y="0" width="680" height="520" rx="20" fill="#ffffff" stroke="#dce3ef" stroke-width="2"/>

    <!-- ブラウザバー -->
    <rect x="0" y="0" width="680" height="52" rx="20" fill="#f4f7fb"/>
    <rect x="0" y="34" width="680" height="18" fill="#f4f7fb"/>
    <circle cx="34" cy="26" r="7" fill="#dce3ef"/>
    <circle cx="58" cy="26" r="7" fill="#dce3ef"/>
    <circle cx="82" cy="26" r="7" fill="#dce3ef"/>
    <rect x="112" y="14" width="330" height="24" rx="12" fill="#ffffff" stroke="#dce3ef" stroke-width="2"/>
    <line x1="0" y1="52" x2="680" y2="52" stroke="#dce3ef" stroke-width="2"/>

    <!-- アカウント表示（右上を確認、の説明に対応） -->
    <circle cx="626" cy="96" r="22" fill="#e6f4ea" stroke="#15803d" stroke-width="2"/>

    <rect x="56" y="112" width="360" height="24" rx="12" fill="#172033" opacity=".72"/>
    <rect x="56" y="158" width="470" height="14" rx="7" fill="#5d687c" opacity=".36"/>
    <rect x="56" y="188" width="392" height="14" rx="7" fill="#5d687c" opacity=".36"/>

    <!-- 「テスターになる」ボタン -->
    <rect x="56" y="252" width="252" height="64" rx="32" fill="#18794e"/>
    <rect x="98" y="274" width="168" height="20" rx="10" fill="#ffffff" opacity=".92"/>

    <rect x="56" y="358" width="568" height="14" rx="7" fill="#5d687c" opacity=".28"/>
    <rect x="56" y="392" width="500" height="14" rx="7" fill="#5d687c" opacity=".28"/>
    <rect x="56" y="426" width="330" height="14" rx="7" fill="#5d687c" opacity=".28"/>
  </g>

  <!-- 差し替え案内 -->
  <g text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
    <text x="800" y="120" font-size="34" font-weight="700" fill="#0f5c2c">画像は準備中です</text>
    <text x="800" y="770" font-size="26" fill="#5d687c">Google Playでクローズドテストを設定したあと、参加ページを撮影して差し替えます</text>
    <text x="800" y="812" font-size="22" fill="#8b95a6">images/step-2-opt-in.svg</text>
  </g>
</svg>
